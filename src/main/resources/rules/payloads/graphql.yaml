attackType: GRAPHQL
aliases: [GRAPHQL_INTROSPECTION, GRAPHQL注入, GraphQL探测]
goal: CONFIRM_ATTACK_TYPE

probes:
  - id: graphql_typename_probe
    technique: GRAPHQL_INTROSPECTION
    strategy: GRAPHQL_INTROSPECTION
    priority: 10
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.72
    applicableParamTypes: [BODY, QUERY]
    valueTypes: [STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "{__typename}"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: KEYWORD
      keywords:
        - "__typename"
        - "data"
      minConfidence: 0.58

  - id: graphql_schema_introspection_probe
    technique: GRAPHQL_INTROSPECTION
    strategy: GRAPHQL_INTROSPECTION
    priority: 20
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 160
    evidenceWeight: 0.82
    applicableParamTypes: [BODY, QUERY]
    valueTypes: [STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "{__schema{queryType{name}}}"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: KEYWORD
      keywords:
        - "__schema"
        - "queryType"
      minConfidence: 0.66

