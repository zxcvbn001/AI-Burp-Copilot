# 璁よ瘉/鎺堟潈缁曡繃鍊欓€夐獙璇佽鍒欍€?
# 褰撳墠閫氱敤鍙樺紓鍣ㄥ Header/Cookie 鐨勪笂涓嬫枃鑳藉姏鏈夐檺锛岄粯璁ゅ叧闂珮璇姤鎺㈤拡銆?
# 濡傛灉浣犳湁鏄庣‘鐨勪綆鏉冮檺 token 鎴栨祴璇曡处鍙蜂笂涓嬫枃锛屽缓璁湪澶栫疆瑙勫垯涓惎鐢ㄥ苟鏀规垚鐪熷疄瀹夊叏鏍锋湰銆?
attackType: AUTH
aliases: [AUTH_BYPASS, AUTHORIZATION, AUTHENTICATION, ACCESS_CONTROL, UNAUTHORIZED_ACCESS, 认证绕过, 鉴权绕过, 授权绕过, 访问控制]
goal: CONFIRM_ATTACK_TYPE
workflow:
  name: AUTH Verification
  description: Header/Cookie authorization checks can run without parameter influence gate.
  includeInfluenceStep: false
  requiresInfluenceApproval: false

probes:
  - id: auth_remove_token
    technique: REMOVE_TOKEN
    strategy: REMOVE_TOKEN
    enabledByDefault: true
    priority: 10
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 64
    evidenceWeight: 0.70
    applicableParamTypes: [HEADER, COOKIE]
    valueTypes: [JWT, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: ""
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_SIMILAR
      minSimilarityTrueBaseline: 0.90
      minConfidence: 0.62

  - id: auth_invalid_role_token
    technique: ROLE_SWITCH
    strategy: ROLE_SWITCH
    enabledByDefault: true
    priority: 20
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.65
    applicableParamTypes: [HEADER, COOKIE]
    valueTypes: [JWT, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "Bearer invalid-role-token"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_SIMILAR
      minSimilarityTrueBaseline: 0.90
      minConfidence: 0.58
