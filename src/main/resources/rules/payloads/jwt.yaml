attackType: JWT
aliases: [JSON_WEB_TOKEN, TOKEN, TOKEN_TAMPERING, JWT篡改, 令牌篡改]
goal: CONFIRM_ATTACK_TYPE
workflow:
  name: JWT Verification
  description: Header/Cookie token tampering checks can run without parameter influence gate.
  includeInfluenceStep: false
  requiresInfluenceApproval: false

probes:
  - id: jwt_empty_token_still_accepted
    technique: REMOVE_TOKEN
    strategy: REMOVE_TOKEN
    priority: 10
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 32
    evidenceWeight: 0.70
    applicableParamTypes: [HEADER, COOKIE]
    valueTypes: [JWT, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: ""
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_SIMILAR
      minSimilarityTrueBaseline: 0.90
      minConfidence: 0.62

  - id: jwt_invalid_token_still_accepted
    technique: INVALID_TOKEN
    strategy: INVALID_TOKEN
    priority: 20
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.68
    applicableParamTypes: [HEADER, COOKIE]
    valueTypes: [JWT, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "Bearer invalid.invalid.invalid"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_SIMILAR
      minSimilarityTrueBaseline: 0.90
      minConfidence: 0.60

