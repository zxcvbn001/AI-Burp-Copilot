llm:
  provider: "deepseek"
  model: "deepseek-chat"
  apiKey: ""
  apiUrl: "https://api.deepseek.com/v1/chat/completions"
  temperature: 0.3
  connectTimeoutMs: 30000
  readTimeoutMs: 120000
  writeTimeoutMs: 120000
  maxRetries: 2
  sendModel: true
  sendTemperature: true
  sendMaxTokens: true
  authorizationEnabled: true
  authHeaderName: "Authorization"
  authHeaderPrefix: "Bearer"
  extraHeaders: {}

scan:
  skipExtensions:
    - "png"
    - "jpg"
    - "jpeg"
    - "gif"
    - "css"
    - "woff"
    - "woff2"
    - "ttf"
    - "eot"
    - "ico"
    - "mp4"
    - "webm"
  skipKeywords:
    - "logout"
    - "heartbeat"
    - "health"
    - "favicon"
  skipStatusCodes:
    - 204
    - 304
  responseBodyScan:
    enabled: true
    maxSize: 204800
  staticScanMaxSize: 204800

ai:
  maxTokens: 20480
  timeoutMs: 60000
  maxPromptLength: 8000
  rateLimitPerSecond: 5

request:
  concurrency: 5
  maxQueueSize: 1000

storage:
  maxHistory: 10000
  cacheTtlSeconds: 3600
  maxCacheEntries: 5000

verification:
  enabled: false
  maxRequestsPerEndpoint: 5
  requestTimeoutSeconds: 10
  whitelist: []
  maxPayloadLength: 128
