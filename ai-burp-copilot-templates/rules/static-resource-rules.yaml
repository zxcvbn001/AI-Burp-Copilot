# ============================================
# 静态资源扫描规则配置
# ============================================
# 文件位置：rules/static-resource-rules.yaml
# 支持热加载：修改后调用 IPromptService.reload() 即可生效
#
# 规则字段说明：
#   name        - 规则名称（用于展示和日志）
#   regex       - 正则表达式（Java 标准正则语法）
#   severity    - 严重程度：HIGH / MEDIUM / LOW / INFO
#   enabled     - 是否启用（false 则跳过该规则）
#   description - 规则描述（可选）
#
# Phase 2 扩展：
#   - 可增加 category 字段分组管理
#   - 可扩展 include/exclude 路径白名单
# ============================================

rules:
  - name: AWS Access Key
    regex: "AKIA[0-9A-Z]{16}"
    severity: HIGH
    enabled: true
    description: "Amazon Web Services access key ID"

  - name: Google API Key
    regex: "AIza[0-9A-Za-z_-]{35}"
    severity: HIGH
    enabled: true
    description: "Google Cloud API key"

  - name: Generic API Key
    regex: "(?i)(api[_-]?key|apikey|api_secret|secret[_-]?key)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-]{16,}['\"]"
    severity: HIGH
    enabled: true
    description: "Generic API key assignment in code"

  - name: Hardcoded Password
    regex: "(?i)(password|passwd|pwd|pass)\\s*[:=]\\s*['\"][^'\"]{3,}['\"]"
    severity: HIGH
    enabled: true
    description: "Hardcoded password value"

  - name: Hardcoded Token
    regex: "(?i)(token|access_token|refresh_token|auth_token|bearer_token)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-\\.]{20,}['\"]"
    severity: HIGH
    enabled: true
    description: "Hardcoded API token or access token"

  - name: Hardcoded Secret
    regex: "(?i)(secret|private_key|master_key|encryption_key)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
    severity: HIGH
    enabled: true
    description: "Hardcoded secret key or private key"

  - name: Source Mapping URL
    regex: "//# sourceMappingURL=.*"
    severity: MEDIUM
    enabled: true
    description: "JavaScript source map reference (may expose source code)"

  - name: Internal IP Address
    regex: "(10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1|localhost)"
    severity: MEDIUM
    enabled: true
    description: "Internal/private IP address disclosure"

  - name: Internal Domain
    regex: "(?i)\\.internal\\.|\\bstaging\\b|\\bdev\\b|\\.test\\.|\\bdebug\\b|\\.local\\b"
    severity: MEDIUM
    enabled: true
    description: "Internal domain name or environment identifier"

  - name: JWT Token
    regex: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
    severity: HIGH
    enabled: true
    description: "JWT token (Base64-encoded JSON Web Token)"

  - name: Slack Token
    regex: "xox[baprs]-[0-9a-zA-Z-]{10,}"
    severity: HIGH
    enabled: true
    description: "Slack API token"

  - name: GitHub Token
    regex: "(?i)(gh[pousr]_[A-Za-z0-9_]{36,}|github[_-]?token\\s*[:=]\\s*['\"][A-Za-z0-9_]{20,}['\"])"
    severity: HIGH
    enabled: true
    description: "GitHub personal access token"

  - name: Private Key
    regex: "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
    severity: HIGH
    enabled: true
    description: "Private key or certificate"

  - name: Database Connection String
    regex: "(?i)(jdbc|mongodb|redis|postgres|mysql)://[^\\s\"']+"
    severity: MEDIUM
    enabled: true
    description: "Database connection string with credentials"

  - name: OAuth Client Secret
    regex: "(?i)(oauth[_-]?client[_-]?secret|client[_-]?secret)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-]{16,}['\"]"
    severity: HIGH
    enabled: true
    description: "OAuth client secret"

  - name: Firebase Config
    regex: "(?i)(firebase|firebaseio\\.com|firebaseapp\\.com)"
    severity: MEDIUM
    enabled: true
    description: "Firebase configuration reference"

  - name: S3 Bucket URL
    regex: "(?i)(s3\\.amazonaws\\.com|s3-[a-z0-9-]+\\.amazonaws\\.com)"
    severity: MEDIUM
    enabled: true
    description: "AWS S3 bucket URL"

  - name: Azure Storage Key
    regex: "(?i)(DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]+)"
    severity: HIGH
    enabled: true
    description: "Azure Storage connection string with key"

  - name: Email Address Exposure
    regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    severity: LOW
    enabled: true
    description: "Email address found in static resource"
