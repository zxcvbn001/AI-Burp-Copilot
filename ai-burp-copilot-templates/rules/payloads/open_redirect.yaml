# Open Redirect minimal verification rules.
# The probe uses an inert example.com URL and confirms evidence only from the HTTP Location header.
attackType: OPEN_REDIRECT
goal: CONFIRM_ATTACK_TYPE

probes:
  - id: open_redirect_absolute_url
    technique: OPEN_REDIRECT
    strategy: OPEN_REDIRECT_PROBE
    priority: 10
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.88
    applicableParamTypes: [QUERY, BODY]
    valueTypes: [URL, STRING, UNKNOWN]
    payloads:
      - value: "https://example.com/{{randLower:redirectMarker:12}}"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "example.com"
          - "{{randLower:redirectMarker:12}}"
    oracle:
      type: REDIRECT_LOCATION
      requireMarkers:
        - "example.com"
        - "{{randLower:redirectMarker:12}}"
      minConfidence: 0.82

  - id: open_redirect_protocol_relative
    technique: OPEN_REDIRECT
    strategy: OPEN_REDIRECT_PROBE
    priority: 20
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.82
    applicableParamTypes: [QUERY, BODY]
    valueTypes: [URL, STRING, UNKNOWN]
    payloads:
      - value: "//example.com/{{randLower:redirectMarker:12}}"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "example.com"
          - "{{randLower:redirectMarker:12}}"
    oracle:
      type: REDIRECT_LOCATION
      requireMarkers:
        - "example.com"
        - "{{randLower:redirectMarker:12}}"
      minConfidence: 0.78

  - id: open_redirect_encoded_absolute_url
    technique: OPEN_REDIRECT
    strategy: OPEN_REDIRECT_PROBE
    priority: 30
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 128
    evidenceWeight: 0.80
    applicableParamTypes: [QUERY, BODY]
    valueTypes: [URL, STRING, UNKNOWN]
    payloads:
      - value: "https:%2F%2Fexample.com%2F{{randLower:redirectMarker:12}}"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "example.com"
          - "{{randLower:redirectMarker:12}}"
    oracle:
      type: REDIRECT_LOCATION
      requireMarkers:
        - "example.com"
        - "{{randLower:redirectMarker:12}}"
      minConfidence: 0.76
