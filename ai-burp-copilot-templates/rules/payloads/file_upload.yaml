attackType: FILE_UPLOAD
aliases: [UNRESTRICTED_FILE_UPLOAD, UPLOAD, 任意文件上传, 文件上传]
goal: CONFIRM_ATTACK_TYPE
workflow:
  name: FILE_UPLOAD Verification
  description: Multipart upload checks run directly on upload fields and do not require generic parameter influence gate.
  includeInfluenceStep: false
  requiresInfluenceApproval: false

probes:
  - id: upload_extension_marker_probe
    technique: EXTENSION_PROBE
    strategy: EXTENSION_PROBE
    strength: WEAK
    priority: 10
    httpMethods: [POST, PUT, PATCH]
    stopOnMatch: false
    maxRequests: 1
    maxPayloadLength: 64
    evidenceWeight: 0.70
    applicableParamTypes: [BODY]
    valueTypes: [STRING, UNKNOWN]
    requiresLlmReview: false
    payloads:
      - value: "ai-burp-copilot-upload-test.txtxx"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: KEYWORD
      keywords:
        - "ai-burp-copilot-upload-test.txtxx"
        - ".txtxx"
      minConfidence: 0.58

  - id: upload_double_extension_marker_probe
    technique: EXTENSION_PROBE
    strategy: EXTENSION_PROBE
    strength: MEDIUM
    priority: 20
    httpMethods: [POST, PUT, PATCH]
    stopOnMatch: false
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.72
    applicableParamTypes: [BODY]
    valueTypes: [STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "ai-burp-copilot-upload-test.jpg.html"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_DIFF
      maxSimilarityTrueFalse: 0.92
      minConfidence: 0.60

  - id: upload_svg_marker_probe
    technique: EXTENSION_PROBE
    strategy: EXTENSION_PROBE
    strength: MEDIUM
    priority: 30
    httpMethods: [POST, PUT, PATCH]
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.70
    applicableParamTypes: [BODY]
    valueTypes: [STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "ai-burp-copilot-upload-test.svg"
        role: TRIGGER
        mutation: REPLACE
    oracle:
      type: BASELINE_DIFF
      maxSimilarityTrueFalse: 0.92
      minConfidence: 0.60
