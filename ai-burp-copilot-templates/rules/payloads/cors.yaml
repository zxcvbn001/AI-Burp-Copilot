attackType: CORS
aliases: [CORS_MISCONFIGURATION, ORIGIN_TRUST, 跨域配置错误, CORS错误配置]
goal: CONFIRM_ATTACK_TYPE
workflow:
  name: CORS Verification
  description: Origin header trust checks can run without parameter influence gate.
  includeInfluenceStep: false
  requiresInfluenceApproval: false

probes:
  - id: cors_origin_reflection
    technique: ORIGIN_REFLECTION
    strategy: ORIGIN_REFLECTION
    strength: MEDIUM
    priority: 10
    httpMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    stopOnMatch: false
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.82
    applicableParamTypes: [HEADER]
    valueTypes: [URL, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "https://evil.example"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "evil.example"
    oracle:
      type: KEYWORD
      keywords:
        - "access-control-allow-origin: https://evil.example"
        - "access-control-allow-credentials: true"
      minConfidence: 0.66

  - id: cors_null_origin_reflection
    technique: ORIGIN_REFLECTION
    strategy: ORIGIN_REFLECTION
    strength: MEDIUM
    priority: 20
    httpMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    stopOnMatch: false
    maxRequests: 1
    maxPayloadLength: 32
    evidenceWeight: 0.76
    applicableParamTypes: [HEADER]
    valueTypes: [URL, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "null"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "access-control-allow-origin: null"
    oracle:
      type: KEYWORD
      keywords:
        - "access-control-allow-origin: null"
      minConfidence: 0.62

  - id: cors_subdomain_origin_reflection
    technique: ORIGIN_REFLECTION
    strategy: ORIGIN_REFLECTION
    strength: STRONG
    priority: 30
    httpMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    stopOnMatch: true
    maxRequests: 1
    maxPayloadLength: 96
    evidenceWeight: 0.78
    applicableParamTypes: [HEADER]
    valueTypes: [URL, STRING, UNKNOWN]
    requiresLlmReview: true
    payloads:
      - value: "https://sub.evil.example"
        role: TRIGGER
        mutation: REPLACE
        markers:
          - "sub.evil.example"
    oracle:
      type: KEYWORD
      keywords:
        - "access-control-allow-origin: https://sub.evil.example"
        - "access-control-allow-credentials: true"
      minConfidence: 0.66

