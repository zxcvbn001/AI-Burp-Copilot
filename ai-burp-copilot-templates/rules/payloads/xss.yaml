# XSS 最小化验证规则。
# 默认使用无害 HTML 标记，只确认响应中是否出现未转义反射痕迹。
attackType: XSS
aliases: [CROSS_SITE_SCRIPTING, 跨站脚本]
goal: CONFIRM_ATTACK_TYPE

probes:
  - id: xss_harmless_html_reflection
    technique: REFLECTION
    strategy: BOOLEAN_BASED_MINIMAL
    strength: WEAK
    priority: 10
    stopOnMatch: false
    maxRequests: 1
    requiresLlmReview: true
    maxPayloadLength: 64
    evidenceWeight: 0.85
    applicableParamTypes: [QUERY, BODY, PATH]
    valueTypes: [STRING, EMAIL, URL, UNKNOWN]
    payloads:
      - value: "<{{randLower:xssTag:8}}>{{randLower:xssText:10}}</{{randLower:xssTag:8}}>"
        role: TRIGGER
        mutation: APPEND
        markers:
          - ">{{randLower:xssText:10}}"
          - "<{{randLower:xssTag:8}}"
    oracle:
      type: HTML_REFLECTION
      requireExactPayload: false
      requireUnescaped: true
      requireMarkers:
        - "<{{randLower:xssTag:8}}"
      minConfidence: 0.72

  - id: xss_harmless_dom_reflection
    technique: REFLECTION
    strategy: BOOLEAN_BASED_MINIMAL
    strength: MEDIUM
    priority: 15
    stopOnMatch: true
    maxRequests: 1
    requiresLlmReview: true
    maxPayloadLength: 64
    evidenceWeight: 0.85
    applicableParamTypes: [QUERY, BODY, PATH]
    valueTypes: [STRING, EMAIL, URL, UNKNOWN]
    payloads:
      - value: "\"{{randLower:xssAttr:14}}"
        role: TRIGGER
        mutation: APPEND
        markers:
          - "\"{{randLower:xssAttr:14}}"
    oracle:
      type: HTML_REFLECTION
      requireExactPayload: false
      requireUnescaped: true
      requireMarkers:
        - "\"{{randLower:xssAttr:14}}"
      minConfidence: 0.72

  - id: xss_harmless_context_break_reflection
    technique: REFLECTION
    strategy: BOOLEAN_BASED_MINIMAL
    strength: STRONG
    priority: 20
    stopOnMatch: true
    maxRequests: 1
    requiresLlmReview: true
    maxPayloadLength: 96
    evidenceWeight: 0.88
    applicableParamTypes: [QUERY, BODY, PATH]
    valueTypes: [STRING, EMAIL, URL, UNKNOWN]
    payloads:
      - value: "\"></title><{{randLower:xssTag:8}}>{{randLower:xssText:10}}</{{randLower:xssTag:8}}>"
        role: TRIGGER
        mutation: APPEND
        markers:
          - "</title>"
          - "<{{randLower:xssTag:8}}"
          - ">{{randLower:xssText:10}}"
    oracle:
      type: HTML_REFLECTION
      requireExactPayload: false
      requireUnescaped: true
      requireMarkers:
        - "<{{randLower:xssTag:8}}"
        - "</title>"
      minConfidence: 0.76
