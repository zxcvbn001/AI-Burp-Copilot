llm:
  provider: openai
  model: gpt-4o-mini
  apiKey: YOUR_API_KEY_HERE
  apiUrl: https://api.openai.com/v1/chat/completions
  temperature: 0.3
  connectTimeoutMs: 30000
  readTimeoutMs: 120000
  writeTimeoutMs: 120000
  maxRetries: 2
  sendModel: true
  sendTemperature: true
  sendMaxTokens: true
  authorizationEnabled: true
  authHeaderName: Authorization
  authHeaderPrefix: Bearer
  extraHeaders: {}
scan:
  skipExtensions:
    - png
    - jpg
    - jpeg
    - gif
    - css
    - woff
    - woff2
    - ttf
    - eot
    - ico
    - mp4
    - webm
  skipKeywords:
    - logout
    - heartbeat
    - health
    - favicon
  skipStatusCodes:
    - 204
    - 304
  responseBodyScan:
    enabled: true
    maxSize: 204800
  staticScanMaxSize: 200
ai:
  maxTokens: 20480
  timeoutMs: 60000
  maxPromptLength: 8000
  rateLimitPerMinute: 10
jsAnalysis:
  enabled: true
  baseUrl: http://127.0.0.1:3000
  apiKey: YOUR_JS_ANALYSIS_API_KEY_HERE
  apiKeyHeader: x-api-key
  healthPath: /health
  analyzePath: /analyze/js
  fastMode: false
  mode: full
  responseMode: compact
  submitAsync: true
  taskPollIntervalMs: 1000
  taskTimeoutMs: 180000
  connectTimeoutMs: 8000
  readTimeoutMs: 60000
  writeTimeoutMs: 30000
  maxConcurrentAnalyses: 2
  progressPublishIntervalMs: 1500
  maxReferencedScripts: 6
  maxRecursiveDepth: 1
  maxVerifiedEndpointsPerScript: 12
  autoVerifyRecoveredApis: true
  autoAnalyzeVerifiedApis: true
  autoFetchReferencedScripts: true
  requestBuilder:
    enabled: true
    appendParamsToQuery: true
    buildBodyForUnsafeMethods: false
    defaultBodyFormat: json
    placeholderValue: ""
    copyJsHeaders: true
    copyAuthSignalHeaders: false
    maxParams: 20
    maxHeaders: 12
request:
  concurrency: 5
  maxQueueSize: 1000
storage:
  maxHistory: 2000
  cacheTtlSeconds: 3600
  maxCacheEntries: 5000
  historyDbPath: ""
verification:
  enabled: true
  maxRequestsPerEndpoint: 5
  requestTimeoutSeconds: 10
  whitelist: []
  maxPayloadLength: 128
  allowedInfluenceActions:
    - READ
    - CREATE
    - UPDATE
    - DELETE
    - AUTH
    - UNKNOWN
    - ALL
  allowedVerificationActions:
    - READ
    - CREATE
    - UPDATE
    - DELETE
    - AUTH
    - UNKNOWN
    - ALL
