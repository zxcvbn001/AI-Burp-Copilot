name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn --batch-mode test

      - name: Package
        run: mvn --batch-mode -DskipTests package

      - name: Prepare release asset
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
          fi
          cp target/ai-burp-copilot-v2-jar-with-dependencies.jar "target/ai-burp-copilot-${TAG_NAME}.jar"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_PATH=target/ai-burp-copilot-${TAG_NAME}.jar" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AI Burp Copilot ${{ env.TAG_NAME }}
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
